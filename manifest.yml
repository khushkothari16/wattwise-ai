applications:
  - name: wattwise-ai-backend
    memory: 512M
    instances: 1
    buildpacks:
      - python_buildpack
    command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    path: ./backend
    env:
      WATSONX_URL: https://us-south.ml.cloud.ibm.com
      GRANITE_MODEL_ID: ibm/granite-13b-chat-v2
